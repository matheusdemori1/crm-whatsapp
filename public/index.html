<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM WhatsApp</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #25D366; --green-dark: #128C7E; --green-light: #dcf8c6;
      --sidebar: #1a1a2e; --bg: #f0f2f5; --white: #ffffff;
      --border: #e1e5e9; --text: #1a1a2e; --text-muted: #6c757d;
      --red: #e74c3c; --yellow: #f39c12; --blue: #3498db;
      --shadow: 0 2px 12px rgba(0,0,0,0.08); --radius: 12px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* LOGIN */
    #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); }
    .login-box { background:white; border-radius:20px; padding:48px 40px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo .icon { font-size:48px; }
    .login-logo h1 { font-size:24px; font-weight:700; margin-top:8px; }
    .login-logo p { color:var(--text-muted); font-size:14px; margin-top:4px; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; outline:none; background:white; transition:border-color 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--green); }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .btn-primary { background:var(--green); color:white; } .btn-primary:hover { background:var(--green-dark); transform:translateY(-1px); }
    .btn-danger { background:var(--red); color:white; } .btn-danger:hover { background:#c0392b; }
    .btn-secondary { background:var(--border); color:var(--text); } .btn-secondary:hover { background:#d0d5dd; }
    .btn-full { width:100%; justify-content:center; padding:14px; font-size:16px; }
    .error-msg { color:var(--red); font-size:13px; margin-top:8px; text-align:center; }

    /* LAYOUT */
    #app { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:240px; background:var(--sidebar); color:white; display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-header { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
    .sidebar-logo { display:flex; align-items:center; gap:12px; }
    .sidebar-logo .icon { font-size:28px; }
    .sidebar-logo h2 { font-size:18px; font-weight:700; }
    .sidebar-logo p { font-size:11px; color:rgba(255,255,255,0.5); }
    .sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; cursor:pointer; transition:all 0.15s; color:rgba(255,255,255,0.65); font-size:14px; font-weight:500; margin-bottom:4px; }
    .nav-item:hover { background:rgba(255,255,255,0.08); color:white; }
    .nav-item.active { background:var(--green); color:white; }
    .nav-item .icon { font-size:18px; width:22px; text-align:center; }
    .nav-badge { margin-left:auto; background:var(--red); color:white; font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; min-width:20px; text-align:center; }
    .sidebar-user { padding:16px; border-top:1px solid rgba(255,255,255,0.1); }
    .user-info { display:flex; align-items:center; gap:10px; }
    .user-avatar { width:36px; height:36px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
    .user-name { font-size:13px; font-weight:600; }
    .user-role { font-size:11px; color:rgba(255,255,255,0.5); }
    .logout-btn { margin-top:10px; width:100%; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); border:none; padding:8px; border-radius:8px; cursor:pointer; font-size:13px; }
    .logout-btn:hover { background:rgba(255,255,255,0.15); color:white; }

    /* MAIN */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { background:white; padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .topbar h1 { font-size:20px; font-weight:700; }
    .topbar-actions { display:flex; gap:10px; align-items:center; }
    .content { flex:1; overflow-y:auto; padding:24px; }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card { background:white; border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
    .stat-card .label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); }
    .stat-card .value { font-size:28px; font-weight:700; margin-top:6px; }
    .stat-card .sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .stat-card.green .value { color:var(--green-dark); }
    .stat-card.blue .value { color:var(--blue); }
    .stat-card.orange .value { color:var(--yellow); }
    .stat-card.red .value { color:var(--red); }

    /* FUNIL */
    .funnel-bar { display:flex; gap:4px; margin-bottom:24px; }
    .funnel-step { flex:1; padding:10px 8px; border-radius:8px; text-align:center; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; border:2px solid transparent; }
    .funnel-step:hover { transform:translateY(-2px); }
    .funnel-step .fs-icon { font-size:18px; display:block; margin-bottom:4px; }
    .funnel-step .fs-label { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
    .funnel-step .fs-count { display:block; font-size:20px; font-weight:700; margin-top:2px; }
    .fs-novo      { background:#f0f4ff; color:#4a6cf7; }
    .fs-contatado { background:#fff8e1; color:#f39c12; }
    .fs-pedido    { background:#e8f4fd; color:#2980b9; }
    .fs-pago      { background:#d1f2e3; color:#27ae60; }
    .fs-expirado  { background:#fdecea; color:#e74c3c; }
    .funnel-step.active { border-color: currentColor; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    /* CARD/TABLE */
    .card { background:white; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .card-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .card-header h3 { font-size:15px; font-weight:700; }
    .search-bar { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .search-bar input { flex:1; min-width:180px; padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; outline:none; }
    .search-bar input:focus { border-color:var(--green); }
    .search-bar select { padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; outline:none; }
    table { width:100%; border-collapse:collapse; }
    th { padding:11px 14px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); background:#f8f9fa; border-bottom:1px solid var(--border); }
    td { padding:12px 14px; font-size:14px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafffe; }
    .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; }
    .badge-lead { background:#fff3cd; color:#856404; }
    .badge-cliente { background:#d1f2e3; color:#145a32; }
    .badge-perdido { background:#f8d7da; color:#842029; }
    .badge-novo      { background:#f0f4ff; color:#4a6cf7; }
    .badge-contatado { background:#fff8e1; color:#b8860b; }
    .badge-pedido    { background:#e8f4fd; color:#2980b9; }
    .badge-pago      { background:#d1f2e3; color:#27ae60; }
    .badge-expirado  { background:#fdecea; color:#e74c3c; }
    .action-btns { display:flex; gap:5px; }
    .icon-btn { width:30px; height:30px; border:none; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:14px; transition:all 0.15s; }
    .icon-btn:hover { transform:scale(1.1); }
    .icon-btn-green { background:#e8faf0; color:var(--green-dark); }
    .icon-btn-blue  { background:#e8f4fd; color:var(--blue); }
    .icon-btn-red   { background:#fdecea; color:var(--red); }
    .icon-btn-yellow{ background:#fef9e7; color:var(--yellow); }

    /* COOLDOWN WARNING */
    .cooldown-ok   { color:var(--red); font-size:12px; font-weight:700; }
    .cooldown-wait { color:var(--green-dark); font-size:12px; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
    .modal { background:white; border-radius:16px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .modal-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-header h2 { font-size:18px; font-weight:700; }
    .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-muted); }
    .modal-body { padding:24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }

    /* WHATSAPP */
    .qr-container { display:inline-block; padding:16px; background:white; border-radius:12px; border:2px solid var(--border); margin:16px 0; }
    .qr-container img { display:block; width:220px; height:220px; }
    .wa-status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
    .wa-status-dot.connected { background:var(--green); }
    .wa-status-dot.disconnected { background:var(--red); }
    .wa-status-dot.connecting { background:var(--yellow); animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

    /* INTERACTIONS */
    .interaction-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f0f0f0; }
    .interaction-item:last-child { border-bottom:none; }
    .interaction-icon { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
    .int-outgoing { background:#e8faf0; }
    .int-incoming { background:#e8f4fd; }
    .int-webhook  { background:#fff3cd; }
    .interaction-info .user { font-size:13px; font-weight:600; }
    .interaction-info .notes { font-size:13px; color:var(--text-muted); margin-top:2px; white-space:pre-wrap; word-break:break-word; }
    .interaction-info .date { font-size:11px; color:var(--text-muted); margin-top:3px; }
    .dir-badge { font-size:10px; padding:1px 6px; border-radius:10px; margin-left:6px; font-weight:700; }
    .dir-out { background:#e8faf0; color:var(--green-dark); }
    .dir-in  { background:#e8f4fd; color:var(--blue); }

    /* SALE */
    .sale-item { display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid #f0f0f0; }
    .sale-item:last-child { border-bottom:none; }
    .sale-icon { width:40px; height:40px; border-radius:50%; background:var(--green-light); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .sale-info { flex:1; }
    .sale-info .name { font-size:14px; font-weight:600; }
    .sale-info .meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
    .sale-value { font-size:16px; font-weight:700; color:var(--green-dark); }

    /* TOAST */
    .toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
    .toast { background:var(--sidebar); color:white; padding:14px 20px; border-radius:10px; font-size:14px; box-shadow:0 4px 20px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px; animation:slideIn 0.3s ease; max-width:340px; }
    .toast.success { border-left:4px solid var(--green); }
    .toast.error   { border-left:4px solid var(--red); }
    .toast.info    { border-left:4px solid var(--blue); }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* WEBHOOK BOX */
    .webhook-box { background:#f8f9fa; border-radius:10px; padding:16px; margin-bottom:12px; }
    .webhook-url { font-family:monospace; font-size:12px; word-break:break-all; color:var(--blue); background:white; padding:10px; border-radius:6px; border:1px solid var(--border); margin-top:8px; cursor:pointer; }
    .webhook-url:hover { background:#f0f8ff; }

    /* MISC */
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:600px){.grid-2{grid-template-columns:1fr}}
    .empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); }
    .empty-state .icon { font-size:44px; margin-bottom:10px; }
    .loading { text-align:center; padding:40px; color:var(--text-muted); }
    .spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .hidden { display:none !important; }
    .mt-2 { margin-top:8px; } .mt-3 { margin-top:12px; }
    .text-muted { color:var(--text-muted); }

    /* ALERT STRIP */
    .alert-strip { background:#fff3cd; border-left:4px solid var(--yellow); padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .alert-strip.green { background:#d1f2e3; border-color:var(--green); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">💬</div>
      <h1>CRM WhatsApp</h1>
      <p>Faça login para continuar</p>
    </div>
    <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="seu@email.com" /></div>
    <div class="form-group"><label>Senha</label><input type="password" id="login-password" placeholder="••••••••" /></div>
    <p id="login-error" class="error-msg hidden"></p>
    <button class="btn btn-primary btn-full mt-3" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="icon">💬</div>
        <div><h2>CRM WA</h2><p>Painel de vendas</p></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="showPage('contacts')" id="nav-contacts"><span class="icon">👥</span> Contatos <span class="nav-badge hidden" id="badge-contacts">!</span></div>
      <div class="nav-item" onclick="showPage('funil')" id="nav-funil"><span class="icon">🔀</span> Funil de Vendas</div>
      <div class="nav-item" onclick="showPage('sales')" id="nav-sales"><span class="icon">💰</span> Vendas <span class="nav-badge hidden" id="badge-sales">!</span></div>
      <div class="nav-item" onclick="showPage('whatsapp')" id="nav-whatsapp"><span class="icon">📱</span> WhatsApp</div>
      <div class="nav-item hidden" id="nav-settings" onclick="showPage('settings')"><span class="icon">⚙️</span> Configurações</div>
    </nav>
    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <div><div class="user-name" id="user-display-name">Admin</div><div class="user-role" id="user-display-role">admin</div></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">🚪 Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="page-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const API = '';
let token = localStorage.getItem('crm_token');
let currentUser = JSON.parse(localStorage.getItem('crm_user') || 'null');
let socket = null;
let allContacts = [];
let allSales = [];

// ─── UTILS ───
function api(path, opts = {}) {
  return fetch(API + '/api' + path, {
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers||{}) },
    ...opts
  }).then(async r => {
    if (!r.ok) { const e = await r.json().catch(()=>({error:'Erro'})); throw new Error(e.error||'Erro'); }
    return r.json();
  });
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtMoney(v) { return 'R$ ' + parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
function timeSince(d) {
  if (!d) return '—';
  const m = Math.floor((Date.now() - new Date(d).getTime()) / 60000);
  if (m < 1) return 'agora'; if (m < 60) return `${m}min`; const h=Math.floor(m/60);
  if (h < 24) return `${h}h`; const days=Math.floor(h/24); if (days<7) return `${days}d`; return new Date(d).toLocaleDateString('pt-BR');
}

function statusBadge(s) {
  const m={lead:['badge-lead','Lead'],cliente:['badge-cliente','✅ Cliente'],perdido:['badge-perdido','Perdido']};
  const [c,l]=m[s]||['badge-lead',s]; return `<span class="badge ${c}">${l}</span>`;
}

const FUNNEL_MAP = {
  novo:        { label:'Novo',         icon:'🆕', cls:'badge-novo' },
  contatado:   { label:'Contatado',    icon:'📩', cls:'badge-contatado' },
  pedido_criado:{ label:'Pedido Criado',icon:'🛒', cls:'badge-pedido' },
  pago:        { label:'Pago ✅',       icon:'💰', cls:'badge-pago' },
  expirado:    { label:'Expirado',     icon:'⏰', cls:'badge-expirado' }
};

function funnelBadge(stage) {
  const f = FUNNEL_MAP[stage] || { label: stage, icon:'•', cls:'badge-lead' };
  return `<span class="badge ${f.cls}">${f.icon} ${f.label}</span>`;
}

function cooldownStatus(c) {
  if (!c.last_contact_at) return `<span class="cooldown-ok">⚡ Contatar agora</span>`;
  const days = Math.floor((Date.now() - new Date(c.last_contact_at).getTime()) / 86400000);
  const cd = c.cooldown_days || 3;
  if (days >= cd) return `<span class="cooldown-ok">⚡ Contatar agora</span>`;
  const rem = cd - days;
  return `<span class="cooldown-wait">⏳ Aguardar ${rem}d</span>`;
}

// ─── AUTH ───
async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  try {
    const data = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) }).then(r=>r.json());
    if (data.error) { errEl.textContent=data.error; errEl.classList.remove('hidden'); return; }
    token=data.token; currentUser=data.user;
    localStorage.setItem('crm_token',token); localStorage.setItem('crm_user',JSON.stringify(currentUser));
    initApp();
  } catch(e) { errEl.textContent='Erro de conexão'; errEl.classList.remove('hidden'); }
}
document.addEventListener('keydown', e => { if (e.key==='Enter' && !document.getElementById('login-screen').classList.contains('hidden')) doLogin(); });

function doLogout() {
  localStorage.removeItem('crm_token'); localStorage.removeItem('crm_user');
  token=null; currentUser=null; if (socket) socket.disconnect();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ─── INIT ───
function initApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-display-name').textContent = currentUser.name;
  document.getElementById('user-display-role').textContent = currentUser.role;
  document.getElementById('user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  if (currentUser.role === 'admin') document.getElementById('nav-settings').classList.remove('hidden');

  socket = io();
  socket.emit('join', currentUser.id);

  socket.on('new_sale', sale => {
    toast(`💰 Nova venda! ${sale.contact_name} — ${fmtMoney(sale.value)}`, 'success');
    document.getElementById('badge-sales').classList.remove('hidden');
    allSales.unshift(sale);
  });
  socket.on('contact_updated', updated => {
    const idx = allContacts.findIndex(c => c.id === updated.id);
    if (idx >= 0) allContacts[idx] = { ...allContacts[idx], ...updated };
    if (document.getElementById('nav-contacts').classList.contains('active')) renderContactsTable(allContacts);
    if (document.getElementById('nav-funil').classList.contains('active')) loadFunil();
  });
  socket.on('contact_created', c => {
    allContacts.unshift(c);
    if (document.getElementById('nav-contacts').classList.contains('active')) renderContactsTable(allContacts);
  });
  socket.on('contact_deleted', ({id}) => {
    allContacts = allContacts.filter(c => c.id !== id);
    if (document.getElementById('nav-contacts').classList.contains('active')) renderContactsTable(allContacts);
  });
  socket.on('wa_qr', ({qr}) => {
    const img = document.getElementById('wa-qr-img');
    const box = document.getElementById('wa-qr-box');
    if (img) img.src = qr;
    if (box) box.classList.remove('hidden');
    const s = document.getElementById('wa-status-text');
    if (s) s.innerHTML = '<span class="wa-status-dot connecting"></span> Escaneie o QR Code';
  });
  socket.on('wa_status', ({status, msg}) => {
    const s = document.getElementById('wa-status-text');
    const qb = document.getElementById('wa-qr-box');
    if (s) s.innerHTML = `<span class="wa-status-dot ${status==='connected'?'connected':status==='disconnected'?'disconnected':'connecting'}"></span> ${msg}`;
    if (status === 'connected') { if (qb) qb.classList.add('hidden'); renderWAConnected(); }
    if (status === 'disconnected') { if (qb) qb.classList.add('hidden'); renderWADisconnected(); }
  });

  showPage('dashboard');
}

// ─── NAVIGATION ───
function showPage(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) { navEl.classList.add('active'); navEl.querySelector('.nav-badge')?.classList.add('hidden'); }
  const titles = { dashboard:'Dashboard', contacts:'Contatos', funil:'Funil de Vendas', sales:'Vendas', whatsapp:'WhatsApp', settings:'Configurações' };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';

  if (page === 'dashboard') loadDashboard();
  else if (page === 'contacts') loadContacts();
  else if (page === 'funil') loadFunil();
  else if (page === 'sales') loadSales();
  else if (page === 'whatsapp') loadWhatsApp();
  else if (page === 'settings') loadSettings();
}

function renderContactsPage() {
  const content = document.getElementById('page-content');
  content.innerHTML = `
    <div class="card">
      <div class="search-bar">
        <input type="text" id="contact-search" placeholder="🔍 Nome, telefone ou email..." oninput="filterContacts()" />
        <select id="filter-status" onchange="filterContacts()">
          <option value="">Todos status</option>
          <option value="lead">Leads</option>
          <option value="cliente">Clientes</option>
        </select>
        <select id="filter-funnel" onchange="filterContacts()">
          <option value="">Todos funil</option>
          <option value="novo">🆕 Novo</option>
          <option value="contatado">📩 Contatado</option>
          <option value="pedido_criado">🛒 Pedido Criado</option>
          <option value="pago">💰 Pago</option>
          <option value="expirado">⏰ Expirado</option>
        </select>
        <select id="filter-cooldown" onchange="filterContacts()">
          <option value="">Qualquer data</option>
          <option value="overdue">⚡ Contatar agora</option>
          <option value="1">Não contatado há 1+ dia</option>
          <option value="3">Não contatado há 3+ dias</option>
          <option value="7">Não contatado há 7+ dias</option>
        </select>
      </div>
      <div id="contacts-table-wrap"></div>
    </div>
  `;
  renderContactsTable(allContacts);
}

function filterContacts() {
  const q = document.getElementById('contact-search')?.value.toLowerCase()||'';
  const st = document.getElementById('filter-status')?.value||'';
  const fu = document.getElementById('filter-funnel')?.value||'';
  const cd = document.getElementById('filter-cooldown')?.value||'';
  const filtered = allContacts.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !(c.phone||'').includes(q) && !(c.email||'').toLowerCase().includes(q)) return false;
    if (st && c.status !== st) return false;
    if (fu && c.funnel_stage !== fu) return false;
    if (cd) {
      const daysSince = c.last_contact_at ? Math.floor((Date.now()-new Date(c.last_contact_at).getTime())/86400000) : 9999;
      if (cd === 'overdue') { if (daysSince < (c.cooldown_days||3)) return false; }
      else { if (daysSince < parseInt(cd)) return false; }
    }
    return true;
  });
  renderContactsTable(filtered);
}

function renderContactsTable(contacts) {
  const wrap = document.getElementById('contacts-table-wrap');
  if (!wrap) return;
  if (contacts.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>Nenhum contato encontrado</p></div>';
    return;
  }
  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Nome</th><th>Telefone</th><th>Funil</th><th>Status</th><th>Último Contato</th><th>Cooldown</th><th>Ações</th></tr></thead>
    <tbody>
      ${contacts.map(c => `<tr>
        <td><div style="font-weight:600">${c.name}</div>${c.email?`<div style="font-size:12px;color:#999">${c.email}</div>`:''}</td>
        <td>${c.phone?`<a href="https://wa.me/${c.phone.replace(/\D/g,'')}" target="_blank" style="color:var(--green-dark);font-weight:600;text-decoration:none">📱 ${c.phone}</a>`:'—'}</td>
        <td>${funnelBadge(c.funnel_stage||'novo')}</td>
        <td>${statusBadge(c.status)}</td>
        <td><div>${timeSince(c.last_contact_at)}</div>${c.last_contact_at?`<div style="font-size:11px;color:#999">${fmtDate(c.last_contact_at)}</div>`:''}</td>
        <td>${cooldownStatus(c)}</td>
        <td><div class="action-btns">
          <button class="icon-btn icon-btn-green" title="Enviar WhatsApp (rastreia automaticamente)" onclick="sendWhatsApp(${c.id},'${c.name.replace(/'/g,"\\'")}')">📤</button>
          <button class="icon-btn icon-btn-green" title="Registrar contato manual" onclick="touchContact(${c.id},'${c.name.replace(/'/g,"\\'")}')">☎️</button>
          <button class="icon-btn icon-btn-blue"  title="Ver histórico"    onclick="viewContact(${c.id})">👁</button>
          <button class="icon-btn icon-btn-yellow" title="Registrar venda" onclick="openSaleModal(${c.id},'${c.name.replace(/'/g,"\\'")}')">💰</button>
          <button class="icon-btn icon-btn-blue"  title="Editar"          onclick="openContactModal(${c.id})">✏️</button>
          <button class="icon-btn icon-btn-red"   title="Excluir"         onclick="deleteContact(${c.id})">🗑</button>
        </div></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

// ─── FUNIL ───
async function loadFunil() {
  const content = document.getElementById('page-content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  allContacts = await api('/contacts');

  const stages = ['novo','contatado','pedido_criado','pago','expirado'];
  const grouped = {};
  stages.forEach(s => grouped[s] = []);
  allContacts.forEach(c => { const s = c.funnel_stage||'novo'; if (grouped[s]) grouped[s].push(c); });

  content.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-height:500px">
      ${stages.map(s => {
        const f = FUNNEL_MAP[s]; const list = grouped[s];
        return `<div style="background:white;border-radius:12px;box-shadow:var(--shadow);overflow:hidden">
          <div style="padding:12px 14px;background:#f8f9fa;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;font-weight:700">${f.icon} ${f.label}</span>
            <span style="background:var(--border);padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700">${list.length}</span>
          </div>
          <div style="padding:10px;max-height:600px;overflow-y:auto">
            ${list.length===0?'<div style="text-align:center;padding:20px;color:#999;font-size:13px">Vazio</div>':
              list.map(c=>`<div style="background:#f8f9fa;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer" onclick="viewContact(${c.id})">
                <div style="font-weight:600;font-size:13px">${c.name}</div>
                ${c.phone?`<div style="font-size:11px;color:var(--green-dark);margin-top:2px">📱 ${c.phone}</div>`:''}
                <div style="font-size:11px;color:#999;margin-top:4px;display:flex;justify-content:space-between">
                  <span>${timeSince(c.last_contact_at)}</span>
                  <span>${cooldownStatus(c)}</span>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ─── TOUCH CONTACT ───
function touchContact(id, name) {
  showModal(`☎️ Registrar Contato — ${name}`, `
    <div class="form-group"><label>Tipo</label>
      <select id="touch-type">
        <option value="whatsapp">📱 WhatsApp</option>
        <option value="call">📞 Ligação</option>
        <option value="email">📧 Email</option>
      </select>
    </div>
    <div class="form-group"><label>Direção</label>
      <select id="touch-dir">
        <option value="outgoing">➡️ Eu enviei (saída)</option>
        <option value="incoming">⬅️ Cliente respondeu (entrada)</option>
      </select>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="touch-notes" rows="3" placeholder="O que foi discutido?"></textarea></div>
  `, async () => {
    await api(`/contacts/${id}/touch`, { method:'POST', body:JSON.stringify({
      type: document.getElementById('touch-type').value,
      direction: document.getElementById('touch-dir').value,
      notes: document.getElementById('touch-notes').value
    })});
    toast('Contato registrado!','success');
    const idx = allContacts.findIndex(c=>c.id===id);
    if (idx>=0) { allContacts[idx].last_contact_at=new Date().toISOString(); allContacts[idx].funnel_stage=allContacts[idx].funnel_stage==='novo'?'contatado':allContacts[idx].funnel_stage; }
    filterContacts();
    closeModal();
  });
}

// ─── SEND WHATSAPP ───
function sendWhatsApp(id, name) {
  showModal(`📤 Enviar WhatsApp — ${name}`, `
    <div class="alert-strip green" style="margin-bottom:14px">
      ✅ A mensagem será enviada pelo WhatsApp conectado E o contato será marcado automaticamente no sistema.
    </div>
    <div class="form-group"><label>Mensagem *</label>
      <textarea id="wa-msg-text" rows="5" placeholder="Digite sua mensagem aqui..."></textarea>
    </div>
    <p style="font-size:12px;color:#999;margin-top:4px">O WhatsApp precisa estar conectado (menu WhatsApp) para enviar.</p>
  `, async () => {
    const message = document.getElementById('wa-msg-text').value.trim();
    if (!message) return toast('Digite uma mensagem', 'error');
    try {
      await api(`/whatsapp/send/${id}`, { method: 'POST', body: JSON.stringify({ message }) });
      toast(`✅ Mensagem enviada para ${name}!`, 'success');
      const idx = allContacts.findIndex(c => c.id === id);
      if (idx >= 0) {
        allContacts[idx].last_contact_at = new Date().toISOString();
        if (allContacts[idx].funnel_stage === 'novo') allContacts[idx].funnel_stage = 'contatado';
      }
      filterContacts();
      closeModal();
    } catch(e) {
      toast('Erro: ' + e.message, 'error');
    }
  }, 'Enviar');
}

    <div class="grid-2">
      <div class="form-group"><label>Telefone</label><input id="c-phone" value="${contact?.phone||''}" placeholder="11999999999" /></div>
      <div class="form-group"><label>Email</label><input id="c-email" type="email" value="${contact?.email||''}" /></div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Status</label>
        <select id="c-status">
          <option value="lead" ${contact?.status==='lead'?'selected':''}>Lead</option>
          <option value="cliente" ${contact?.status==='cliente'?'selected':''}>Cliente</option>
          <option value="perdido" ${contact?.status==='perdido'?'selected':''}>Perdido</option>
        </select>
      </div>
      <div class="form-group"><label>Etapa do Funil</label>
        <select id="c-funnel">
          ${Object.entries(FUNNEL_MAP).map(([k,v])=>`<option value="${k}" ${(contact?.funnel_stage||'novo')===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
        </select>

    </div>
    <div class="grid-2">
      <div class="form-group"><label>Responsável</label>
        <select id="c-assigned">
          ${users.map(u=>`<option value="${u.id}" ${(contact?.assigned_to==u.id||(!contact&&u.id==currentUser.id))?'selected':''}>${u.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Cooldown (dias)</label><input id="c-cooldown" type="number" min="1" max="30" value="${contact?.cooldown_days||3}" /></div>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="c-notes" rows="2">${contact?.notes||''}</textarea></div>
  `, async () => {
    const name = document.getElementById('c-name').value.trim();
    if (!name) return toast('Nome é obrigatório','error');
    const body={
      name, phone:document.getElementById('c-phone').value,
      email:document.getElementById('c-email').value, notes:document.getElementById('c-notes').value,

    else await api('/contacts',{method:'POST',body:JSON.stringify(body)});
    toast(id?'Contato atualizado!':'Contato criado!','success');
    closeModal();

async function deleteContact(id) {
  if (!confirm('Excluir este contato?')) return;
  await api(`/contacts/${id}`,{method:'DELETE'});
  toast('Contato excluído','info');
}

      ${sales.map(s=>`<tr>
        <td><div style="font-weight:600">${s.contact_name}</div><div style="font-size:12px;color:#999">${s.contact_phone||''}</div></td>
        <td>${s.product||'—'}</td>
        <td style="font-weight:700;color:var(--green-dark)">${fmtMoney(s.value)}</td>
        <td>${s.user_name||'—'}</td>
        <td><span class="badge ${s.source==='webhook'?'badge-cliente':'badge-lead'}">${s.source==='webhook'?'🔗 Site':'✋ Manual'}</span></td>
        <td style="font-size:12px">${fmtDate(s.purchased_at)}</td>
        <td><button class="icon-btn icon-btn-red" onclick="deleteSale(${s.id})">🗑</button></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

async function openSaleModal(contactId=null) {
  if (!allContacts.length) try { allContacts=await api('/contacts'); } catch {}
  showModal('💰 Registrar Venda', `
    <div class="form-group"><label>Cliente *</label>
      <select id="sale-contact">
        <option value="">Selecione...</option>
        ${allContacts.map(c=>`<option value="${c.id}" ${c.id===contactId?'selected':''}>${c.name}${c.phone?' ('+c.phone+')':''}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Produto</label><input id="sale-product" /></div>
      <div class="form-group"><label>Valor (R$)</label><input id="sale-value" type="number" step="0.01" /></div>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="sale-notes" rows="2"></textarea></div>
  `, async () => {
    const cid=document.getElementById('sale-contact').value;
    if(!cid)return toast('Selecione um cliente','error');
    await api('/sales',{method:'POST',body:JSON.stringify({contact_id:parseInt(cid),product:document.getElementById('sale-product').value,value:document.getElementById('sale-value').value,notes:document.getElementById('sale-notes').value})});
    toast('Venda registrada! 🎉','success');
    allSales=await api('/sales'); renderSalesPage(); closeModal();
  });
}

async function deleteSale(id) {
  if(!confirm('Excluir esta venda?'))return;
  await api(`/sales/${id}`,{method:'DELETE'});
  allSales=allSales.filter(s=>s.id!==id); renderSalesPage(); toast('Excluído','info');
}

// ─── WHATSAPP ───
async function loadWhatsApp() {
  const content=document.getElementById('page-content');
  content.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  let status='disconnected';
  try { const r=await api('/whatsapp/status'); status=r.status; } catch {}
  content.innerHTML=`
    <div style="max-width:520px;margin:0 auto">
      <div class="card">
        <div class="card-header"><h3>📱 Conexão WhatsApp</h3></div>
        <div style="padding:32px;text-align:center">
          <div id="wa-status-text" style="font-size:15px;margin-bottom:20px">
            <span class="wa-status-dot ${status==='connected'?'connected':'disconnected'}"></span>
            ${status==='connected'?'WhatsApp conectado!':'Desconectado'}
          </div>
          <div id="wa-qr-box" class="hidden">
            <p style="font-size:13px;color:#666;margin-bottom:12px">WhatsApp → ⋮ Menu → Dispositivos conectados → Conectar dispositivo</p>
            <div class="qr-container"><img id="wa-qr-img" src="" alt="QR" /></div>
          </div>
          <div id="wa-actions">
            ${status==='connected'
              ?`<button class="btn btn-danger" onclick="disconnectWA()">Desconectar</button>`
              :`<button class="btn btn-primary" onclick="connectWA()">🔗 Conectar WhatsApp</button>`}
          </div>
          <div style="margin-top:20px;background:#f8f9fa;border-radius:10px;padding:16px;text-align:left">
            <h4 style="font-size:13px;margin-bottom:8px">📌 Como funciona o rastreamento</h4>
            <ul style="font-size:13px;color:#666;line-height:1.8;padding-left:16px">
              <li><strong>Você manda mensagem</strong> → sistema detecta, marca "Contatado" e atualiza a data</li>
              <li><strong>Cliente responde</strong> → sistema registra como mensagem recebida</li>
              <li><strong>Cooldown</strong> → você define por quantos dias não abordar o cliente</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function connectWA() {
  document.getElementById('wa-actions').innerHTML='<div class="spinner"></div>';
  document.getElementById('wa-status-text').innerHTML='<span class="wa-status-dot connecting"></span> Aguardando QR...';
  try { await api('/whatsapp/connect',{method:'POST'}); } catch(e) { toast('Erro: '+e.message,'error'); renderWADisconnected(); }
}
async function disconnectWA() {
  if(!confirm('Desconectar WhatsApp?'))return;
  await api('/whatsapp/disconnect',{method:'POST'});
  toast('Desconectado','info'); loadWhatsApp();
}
function renderWAConnected() { const a=document.getElementById('wa-actions'); if(a) a.innerHTML=`<button class="btn btn-danger" onclick="disconnectWA()">Desconectar</button>`; }
function renderWADisconnected() { const a=document.getElementById('wa-actions'); if(a) a.innerHTML=`<button class="btn btn-primary" onclick="connectWA()">🔗 Conectar WhatsApp</button>`; }

// ─── SETTINGS ───
async function loadSettings() {
  const content=document.getElementById('page-content');
  content.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  const [settings,users]=await Promise.all([api('/settings'),api('/users')]);
  content.innerHTML=`
    <div style="display:grid;gap:20px;max-width:700px">
      <div class="card">
        <div class="card-header"><h3>🔗 Webhook do Site</h3></div>
        <div style="padding:20px">
          <p style="font-size:14px;color:#666;margin-bottom:12px">Configure este URL no seu site para registrar vendas automaticamente. Aceita os eventos: <code>user.create</code>, <code>order.create</code>, <code>order.paid</code>, <code>order.expired</code>.</p>
          <div class="webhook-box">
            <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:#999">URL (POST)</label>
            <div class="webhook-url" id="webhook-url" onclick="copyWebhook()" title="Clique para copiar">${settings.webhookUrl}</div>
          </div>
          <div class="webhook-box mt-2">
            <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:#999">URL de TESTE (sem token, para diagnóstico)</label>
            <div class="webhook-url" id="webhook-test-url" onclick="copyTestWebhook()" title="Clique para copiar">${settings.webhookUrl.replace(/\/api\/webhook\/.*/, '/api/webhook/test')}</div>
            <p style="font-size:11px;color:#999;margin-top:6px">Envie um POST para esta URL para ver como o sistema interpreta o payload. Não salva dados.</p>
          </div>
          <div class="webhook-box mt-2">
            <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:#999">Formato order.paid / order.create / order.expired</label>
            <pre style="font-size:12px;background:white;padding:10px;border-radius:6px;border:1px solid var(--border);overflow-x:auto">{ "event": "order.paid",
  "data": {
    "user": { "name": "João", "phone": "5511999998888", "email": "joao@email.com" },
    "product": { "title": "Curso de Node.js" },
    "total": 297.00
  }
}</pre>
          </div>
          <div class="webhook-box mt-2">
            <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:#999">Formato user.create</label>
            <pre style="font-size:12px;background:white;padding:10px;border-radius:6px;border:1px solid var(--border);overflow-x:auto">{ "event": "user.create",
  "data": {
    "name": "João", "phone": "5511999998888", "email": "joao@email.com"
  }
}</pre>
          </div>
          <button class="btn btn-secondary mt-2" onclick="regenerateToken()">🔄 Regenerar Token</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>👥 Vendedoras</h3><button class="btn btn-primary" onclick="openUserModal()">+ Adicionar</button></div>
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Cargo</th><th></th></tr></thead>
          <tbody>${users.map(u=>`<tr>
            <td><strong>${u.name}</strong></td><td>${u.email}</td>
            <td><span class="badge ${u.role==='admin'?'badge-cliente':'badge-lead'}">${u.role}</span></td>
            <td>${u.id!==currentUser.id?`<button class="icon-btn icon-btn-red" onclick="deleteUser(${u.id})">🗑</button>`:'<span style="font-size:12px;color:#999">você</span>'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-header"><h3>🔐 Alterar Senha</h3></div>
        <div style="padding:20px">
          <div class="form-group"><label>Senha Atual</label><input type="password" id="pwd-current" /></div>
          <div class="form-group"><label>Nova Senha</label><input type="password" id="pwd-new" /></div>
          <button class="btn btn-primary" onclick="changePassword()">Alterar</button>
        </div>
      </div>
    </div>
  `;
}

function copyWebhook() {
  navigator.clipboard.writeText(document.getElementById('webhook-url').textContent.trim()).then(()=>toast('URL copiada!','success'));
}
function copyTestWebhook() {
  navigator.clipboard.writeText(document.getElementById('webhook-test-url').textContent.trim()).then(()=>toast('URL de teste copiada!','success'));
}
async function regenerateToken() {
  if(!confirm('Regenerar token?'))return;
  const d=await api('/settings/regenerate-token',{method:'POST'});
  document.getElementById('webhook-url').textContent=d.webhookUrl; toast('Token regenerado!','success');
}
function openUserModal() {
  showModal('+ Nova Vendedora',`
    <div class="form-group"><label>Nome</label><input id="u-name" /></div>
    <div class="form-group"><label>Email</label><input id="u-email" type="email" /></div>
    <div class="form-group"><label>Senha</label><input id="u-password" type="password" /></div>
    <div class="form-group"><label>Cargo</label><select id="u-role"><option value="vendedora">Vendedora</option><option value="admin">Admin</option></select></div>
  `,async()=>{
    const name=document.getElementById('u-name').value.trim();
    const email=document.getElementById('u-email').value.trim();
    const password=document.getElementById('u-password').value;
    if(!name||!email||!password)return toast('Preencha todos os campos','error');
    await api('/users',{method:'POST',body:JSON.stringify({name,email,password,role:document.getElementById('u-role').value})});
    toast('Usuário criado!','success'); closeModal(); loadSettings();
  });
}
async function deleteUser(id) {
  if(!confirm('Excluir usuário?'))return;
  await api(`/users/${id}`,{method:'DELETE'}); toast('Excluído','info'); loadSettings();
}
async function changePassword() {
  const current=document.getElementById('pwd-current').value;
  const newPass=document.getElementById('pwd-new').value;
  if(!current||!newPass)return toast('Preencha os campos','error');
  try { await api('/auth/change-password',{method:'POST',body:JSON.stringify({current,newPass})}); toast('Senha alterada!','success'); document.getElementById('pwd-current').value=''; document.getElementById('pwd-new').value=''; }
  catch(e){toast(e.message,'error');}
}

// ─── MODAL ───
function showModal(title, body, onConfirm=null, confirmLabel='Salvar') {
  const overlay=document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='active-modal';
  overlay.innerHTML=`<div class="modal">
    <div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      ${onConfirm?`<button class="btn btn-primary" id="modal-confirm-btn" onclick="handleModalConfirm()">${confirmLabel}</button>`:`<button class="btn btn-primary" onclick="closeModal()">${confirmLabel}</button>`}
    </div>
  </div>`;
  document.body.appendChild(overlay);
  window._modalConfirm=onConfirm;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
}
async function handleModalConfirm() {
  const btn=document.getElementById('modal-confirm-btn');
  if(!btn)return; btn.disabled=true; btn.textContent='...';
  try { await window._modalConfirm(); } catch(e){toast(e.message,'error');}
  finally { if(btn){btn.disabled=false;btn.textContent='Salvar';} }
}
function closeModal() { document.getElementById('active-modal')?.remove(); }

// ─── START ───
if (token && currentUser) initApp();
</script>
